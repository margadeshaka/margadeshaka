name: Verify and deploy

# On a push:         build, verify, and deploy.
#   main    → production site (margadeshaka-af4de.web.app, and margadeshaka.com once DNS points here)
#   develop → staging site    (margadeshaka-staging.web.app, noindex)
# On a pull request: everything except the deploy (see the Deploy step's `if`).
#
# One job serves both so there is exactly one build recipe — node version, env
# vars, sanity checks. A second workflow duplicating it is how these things
# drift apart, which is the failure mode verify:hosting exists to catch.
#
# Both sites live in the same Firebase project and share one firebase.json,
# selected by the `target` input. `npm run verify:hosting` fails the build if
# the two targets' configs drift apart, or if any internal route URL in the
# export has lost its trailing slash.

on:
  push:
    branches: [main, develop]
  # Same branch list, read as the branch being merged INTO. Gives a PR author
  # the typecheck/build/verify signal before merge instead of after it.
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        required: true
        default: staging
        type: choice
        options: [staging, production]

# One deploy per branch at a time. Superseded runs are cancelled so a slow
# older commit can never land on top of a newer one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Resolve the environment once: the input decides on a manual run, the
      # base branch on a pull request, the pushed branch otherwise. Everything
      # below keys off this. A pull request never deploys, so here TARGET only
      # picks which base URL the verification build is made with — and picking
      # it from base_ref means a main-bound PR is verified as production.
      TARGET: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.environment
        || ((github.event_name == 'pull_request' && github.base_ref || github.ref_name) == 'main'
        && 'production' || 'staging') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the "node": ">=20" engine in package.json.
          node-version: 20
          cache: npm

      - name: Resolve environment
        id: env
        run: |
          if [ "$TARGET" = "production" ]; then
            echo "site=margadeshaka-af4de"    >> "$GITHUB_OUTPUT"
            echo "base_url=https://margadeshaka.com" >> "$GITHUB_OUTPUT"
          else
            echo "site=margadeshaka-staging"  >> "$GITHUB_OUTPUT"
            echo "base_url=https://margadeshaka-staging.web.app" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Verifying as $TARGET (pull request — no deploy)"
          else
            echo "Deploying $TARGET"
          fi

      - run: npm ci

      # Gate the deploy on the checks that can actually fail. `npm run lint` is
      # deliberately not here: the repo has no ESLint config, so `next lint`
      # would prompt interactively and hang the runner.
      - run: npm run typecheck

      - name: Build static export
        env:
          # Baked in at build time — they drive canonical URLs, the sitemap and
          # JSON-LD, so staging must not advertise the production domain.
          NEXT_PUBLIC_BASE_URL: ${{ steps.env.outputs.base_url }}
          # Analytics only on a production deploy; staging traffic would
          # pollute it, and a pull-request build is never served. Optional: if
          # the secret is unset, layout.tsx skips GoogleAnalytics.
          NEXT_PUBLIC_GA_ID: >-
            ${{ (env.TARGET == 'production' && github.event_name != 'pull_request')
            && secrets.NEXT_PUBLIC_GA_ID || '' }}
        run: npm run build

      # Cheap guard against shipping an empty or half-built export.
      - name: Sanity-check the export
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/404.html   || { echo "::error::out/404.html missing";   exit 1; }
          pages=$(find out -name index.html | wc -l | tr -d ' ')
          echo "exported $pages pages"
          [ "$pages" -ge 9 ] || { echo "::error::expected >=9 pages, got $pages"; exit 1; }
          grep -q 'sakha-editorial' out/index.html || { echo "::error::home page is missing the products section"; exit 1; }

      # Two repo invariants, both cheap and both previously broken by hand:
      # the two hosting targets must not drift apart, and every internal route
      # URL must carry the trailing slash the site actually serves. The second
      # half inspects out/, so this runs after the build rather than before it.
      - name: Verify hosting config and internal URLs
        run: npm run verify:hosting

      # Everything above is verification and runs on pull requests too.
      # Everything from here down has side effects, so it does not.
      - name: Deploy
        id: deploy
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: margadeshaka-af4de
          target: ${{ env.TARGET }}
          channelId: live

      - name: Summary
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "### Verified (no deploy)"
              echo
              echo "Typecheck, static export, hosting config and internal URLs all pass."
              echo
              echo "- would target: \`$TARGET\`"
              echo "- base branch: \`${{ github.base_ref }}\`"
              echo "- commit: \`${{ github.event.pull_request.head.sha }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Deployed to \`$TARGET\`"
              echo
              echo "- site: \`${{ steps.env.outputs.site }}\`"
              echo "- url: https://${{ steps.env.outputs.site }}.web.app"
              echo "- commit: \`${{ github.sha }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
